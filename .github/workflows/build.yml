name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Decode font
        run: base64 -d resources/Pusia-Bold.ttf.b64 > resources/Pusia-Bold.ttf

      - name: Build the mod
        id: build
        continue-on-error: true
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Dump MDTextArea header for debugging
        if: always()
        run: |
          echo "===== MDTextArea.hpp ====="
          find . -iname "MDTextArea.hpp" -exec cat {} \;
          echo "===== TextRenderer.hpp ====="
          find . -iname "TextRenderer.hpp" -exec cat {} \;

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload build artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CyrillicTest
          path: ${{ steps.build.outputs.build-output }}
