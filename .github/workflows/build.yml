name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Decode font
        run: base64 -d resources/Pusia-Bold.ttf.b64 > resources/Pusia-Bold.ttf

      - name: Decode and extract texture pack
        run: |
          base64 -d resources/texturepack.tar.gz.b64 > resources/texturepack.tar.gz
          mkdir -p resources/texturepack
          tar -xzf resources/texturepack.tar.gz -C resources/texturepack
          find resources/texturepack -maxdepth 2

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyrillicTest
          path: ${{ steps.build.outputs.build-output }}
